[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snorbik-mcp-hybrid-starter-kit"
version = "0.1.4"
description = "Gabarit officiel pour serveurs MCP Python tri-canal (STDIO, CLI, SDK in-process)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Snorbik AI Engineering", email = "engineering@snorbik.ai" }
]
dependencies = [
    "pydantic>=2.7.0",
    "mcp>=1.0.0"
]

[tool.setuptools]
packages = ["template_mcp_hybride"]

[project.scripts]
template-cli = "template_mcp_hybride.canal_sdk_cli.cli:main"
